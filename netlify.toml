[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # O site é 100% estático (next export). Isso impede o Netlify de
  # tentar instalar/ativar o plugin de runtime do Next.js (feito para
  # SSR/ISR), que não é necessário — e pode até quebrar — aqui.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "20"

# Fallback de 404: o Next.js já gera /404.html no build estático
# (a partir de src/app/not-found.tsx). O Netlify usa esse arquivo
# automaticamente para páginas não encontradas — nada a mais a fazer.
